<!DOCTYPE html>
<html lang="en">

<head>

    <title>Nusuk Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            box-sizing: border-box;
            overflow-x: hidden;
            font-weight: bolder;
        }

        img {
            width: 100%;
        }

        header {
            position: relative;
            display: inline-block;
        }

        .logos-pinks {
            width: 50px;
            height: 200px;
            position: absolute;
            top: 10px;
            left: 5px;
        }

            .logos-pinks img {
                width: 100%;
                /* height: 100%; */
            }

        .macca-medina-logo {
            width: 55px;
    height: 100px;
    position: absolute;
    right: -34px;
    top: -380px;
    overflow: hidden;
    object-fit: cover;
  
        }


            .macca-medina-logo img {
                width: 100%;
            }

        .background-pic {
            width: 3.0in;
            height: 4.0in;
            position: relative;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .header-back-img {
            position: absolute;
            top: 0px;
            left: 0px;
            border-radius: 25px;
        }


        .centered-box {
            /* background-color: #b06023; */
          
            position: absolute;
            text-align: center;
            left: 78px;
            top: 0px;
         
            
        }

        .profile-image {
            width: 95px;
    height: 138px;
    /* text-align: center; */
    margin: 0 auto;
    /* overflow: hidden; */
    /* margin-top: 62px; */
    position: relative;
    top: -324px;
    left: 20px;
        }

            .profile-image .profile-pic {
                height: 100%;
            }

        .vertical-line-code {
            position: absolute;
            bottom: -21px;
            left: 23px;
            background-color: white;
            height: 0px;
            width: 94px;
        }

            .vertical-line-code img {
                background-color: white;
    height: 15px;
    position: relative;
    left: -23px;
    top: -26px;
            }

        .round-black-box {
            background-color: black;
    width: 48px;
    height: 13px;
    border-radius: 10px;
    position: absolute;
    left: 117px;
    top: -373px;
        }

        .nukus-white-logo {
            width: 55px;
    position: absolute;
    margin: 0 auto;
    text-align: center;
    left: 114px;
    top: -368px;
        }

        .blue-icon {
            width: 55px;
            height: 80px;
            position: absolute;
            right: 18px;
            bottom: -22px;
        }

        .raqam-img {
            /* border: 2px solid red; */
            background: transparent;
            position: absolute;
            width: 73px;
            bottom: -5px;
            left: 35px;
        }

        /* BackCard-Design */
        .backcard {
            height: 4.0in;
            width: 3.0in;
            float: right;
            left: 0;
        }

        .card {
            float: left;
            width: 3.0in;
            height: 4.0in;
            border-radius: 15px;
            margin-left: 20px;
            position: relative !important;
     
        }

        .backcard-desin {
            float: left;
            width: 3.0in;
            height: 4.0in;
            border-radius: 15px;
            margin-left: 20px;
            position: relative !important;
            overflow: hidden;
        }

            .backcard-desin img {
                border-radius: 15px;
                height: 100%;
            }

        /* .user-data {
            text-align: center;
            position: absolute;
            width: 300px;
            font-size: 10px;
            top: 100%;
            left: -60%;
            margin-top: -5px;
        } */
         .user-data{
            position: relative;
    top: -310px;
    left: 86px;
         }
        .infoc-container{
            position: relative;
        }
        .input-box-container{
