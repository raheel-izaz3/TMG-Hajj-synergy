<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luggage Card </title>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            font-weight: bolder;
        }


        .card {
            float: left;
            width: 3.0in;
            height: 4.0in;
            background-color: black;
            border-radius: 15px;
            margin-left: 20px;
            position: relative !important;
        }


        .al-barkha-img {
            width: 100%;
            margin-top: 15px;
        }

        .hajjwithkhairlogo {
            width: 200px;
            height: 200px;
            text-align: center;
            margin: 0 auto;
            display: block;
            margin-top: 30px;
            position: relative;
        }

            .hajjwithkhairlogo img {
                width: 100%;
                text-align: center;
            }



        .Hajji_name {
            color: white;
            text-align: center;
            position: relative;
        }



        .password-box {
            color: white;
            margin-top: 109px;
            margin-left: 25px;
        }

        .FC-ID-Box {
            color: white;
            margin-left: 25px;
            margin-top: 15px;
            float: left;
        }

        .no-text {
            font-size: 25px;
        }



        .luggage-company-name {
            color: white;
            /* clear: both; */
            text-align: center;
            padding: 5px;
            /* margin-top: 39px; */
            position: relative;
            bottom: -29px;
        }

        /* BackCard-Design Staye */
        .backcard-desin {
            float: left;
            width: 3.0in;
            height: 4.0in;
            background-color: black;
            border-radius: 15px;
            margin-left: 20px;
            position: relative !important;
        }

        .jwithkhairlogo {
            width: 200px;
            height: 200px;
            text-align: center;
            margin: 0 auto;
            display: block;
            margin-top: 30px;
        }

        .compnay-name-title {
            text-align: center;
            text-transform: uppercase;
            color: white;
            margin-top: 30px;
        }

        .hajj-name-title {
            font-size: 20px;
            margin: 0;
            line-height: 25px;
            border-radius: 16px;
            padding: 17px 30px;
            display: inline-block;
            position: absolute;
            /* top: -5px; */
            left: 22px;
            width: 183px;
        }

        .Luggage-card-text {
            text-align: center;
            background-color: white;
            color: black;
            font-size: 13px;
            border-radius: 3px;
            padding: 3px 5px;
            text-transform: uppercase;
        }

        .box-img {
            position: absolute;
            height: 70px;
            width: 70px;
            left: 202px;
            top: 216px;
            border-radius: 14px;
        }

            .box-img img {
                z-index: -999;
                width: 100%;
                border-radius: 10px;
            }

        .luggage-box {
            z-index: 99999;
            /* border: solid 1px red; */
            top: 60%;
            left: 200px;
            /* position: relative; */
            position: absolute;
            /* top: 20px; */
            text-align: center;
            text-transform: uppercase;
            border-radius: 10px;
            padding: 5px;
            color: black;
            float: right;
            margin-right: 15px;
            margin-top: -13px;
        }

        .name-gradient-image {
            width: 215px;
            /* height: 50px; */
            position: relative;
        }

            .name-gradient-image img {
                width: 100%;
                height: 75px;
                border-radius: 20px;
                position: absolute;
                /* border: 1px solid red; */
                left: 36px;
            }

        .packeg-title-name {
            font-size: 14px;
            position: absolute;
            top: 75px;
            left: 37%;
        }
    </style>
</head>

<body>

    <div class="card">
        <div>
            <img src="[URL LINK]/{1}" alt="" class="al-barkha-img">
        </div>
        <div class="Hajji_name">
            <div class="name-gradient-image">
                <img src="[URL LINK]/Images/Cards/capture.jpg" alt="">
            </div>
            <!-- <h1 style="font-size: 14px;"> ZUNNOON AHMED <br />QADRI </h1> -->
            <h1 class="hajj-name-title">
                {2} <br> {3}
            </h1>


            <h2 class="packeg-title-name"> {4} </h2>
        </div>

        <div class="password-box">
            <h3 style="font-size: 13px;">Passport NO</h3>
            <h3 style="font-size: 13px; "> {5} </h3>

        </div>

        <div class="maktab-box-container">
            <div class="FC-ID-Box">
                <h3 style="font-size: 13px;">FC-ID</h3>
                <h3 style="font-size: 13px; width: 150px; ">
                    {6}
                </h3>
            </div>

            <div class="box-img">
                <img src="[URL LINK]/capture.jpg">
            </div>
            <div class="luggage-box">

                <h3 style="font-size: 10px;"><u>Al-Bait</u></h3>
                <h3 style="font-size: 13px;">Maktab</h3>
                <h1 class="no-text">{7}</h1>
                <h5 style="font-size: 8px;">Service Center </h5>
            </div>
        </div>

        <div class="cleard" style="clear: both;"></div>
        <div class="luggage-company-name">
            <strong class="Luggage-card-text">
                Luggage Cards
            </strong>
            <h4 style="font-size: 12px;margin-top:6px;"> {8} </h4>
        </div>
    </div>

    <!-- backdesign Start here  okey -->
    <div class="backcard-desin">
        <div>
            <img src="[URL LINK]/AL-BARKHA-Header-Logo.png" alt="" class="al-barkha-img">
        </div>

        <div class="hajjwithkhairlogo">
            <img src="[URL LINK]/HAJJ WITH KHAIR.png" alt="">
        </div>

        <div class="compnay-name-title">
            <h2>#Hajj With Khair </h2>
        </div>

    </div>
    <!-- backdesign Endnd Card  -->


</body>

</html>
