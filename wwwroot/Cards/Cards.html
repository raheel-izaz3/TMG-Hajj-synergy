<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Government-Card</title>

    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .top-heading {
            margin: 0 auto;
            text-align: center;
        }

        .top-hajj-title {
            background-color: #00904b;
            color: white;
            font-size: 12px;
            display: inline-block;
            padding: 5px;
        }

        .main-title {
            background-color: #00904b;
            color: white;
            padding: 3px 10px;
            /* padding-top: 12px; */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
        }

        .fourth-card {
            width: 3.4in;
            height: 2.1in;
            /* border: 2px solid black; */
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin: 10px;
        }

        .hajj-clinet-info-conatiner {
            width: 100%;
        }



        .govt_logo {
            width: 67px;
            height: 53px;
            position: absolute;
            left: 14px;
            top: 5px;
        }

            .govt_logo img {
                width: 100%;
                height: 100%;
            }

        .pak-flag-pic {
            width: 30px;
            height: 20px;
            position: absolute;
            right: 54px;
            top: 20px;
            ;
        }

            .pak-flag-pic img {
                width: 100%;
                height: 100%;
            }


        .islamic-jumeriya-pic {
            width: 135px;
            margin: 2px auto;
        }

            .islamic-jumeriya-pic img {
                width: 100%;
            }

        .islamic-republic-text {
            text-transform: uppercase;
            text-align: center;
        }



        .student-card .passport-image {
            width: 50px;
            height: 57px;
            float: left;
            margin-right: 10px;
            /* border: 1px solid rgb(190, 189, 189); */
            /* box-shadow: gray; */
            box-shadow: rgba(0, 0, 0, 0.05) 0px 6px 24px 0px, rgba(0, 0, 0, 0.08) 0px 0px 0px 1px;
            margin-top: 4px;
            margin-left: 15px;
            border: 1px solid black;
        }

            .student-card .passport-image img {
                width: 100%;
                height: 100%;
            }

        .student-info {
            overflow: hidden;
            position: relative;
            top: -5px;
        }

            /*  */
            .student-info p {
                /* text-transform: uppercase; */
                border-bottom: 0.5px solid #0202028a;
                font-size: 6px;
                margin-top: 2px;
            }

        .cid-no {
            display: inline-block;
            font-size: 5px;
            font-weight: 500;
            position: relative;
            top: -5px;
        }

        .maktab-number-container {
            width: 42px;
            /* padding: 2px 3px; */
            border-radius: 8px;
            text-align: center;
            color: white;
            background: #bc9635 !important;
            position: absolute;
            bottom: 2px;
            /* left: 8px; */
            left: 22px;
        }

        .maktab-text {
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .no-text {
            font-size: 43px;
        }

        .left-side-text {
            float: left;
        }

        .right-side-text {
            float: right;
        }




        /* BACK-CARD-STYLING ################## */
        .back-side-design {
            width: 3.4in;
            height: 2.1in;
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin: 10px;
        }


            .back-side-design img {
                width: 100%;
            }

        .front-card-left-side {
            float: left;
        }

        .backcard-right-side {
            float: left;
        }


        /* BACK-CARD-STYLING ################## */
    </style>

</head>
<body>

    <div class="front-card-left-side ">
        <section class=" fourth-card">
            <div class="bg-pink-color" style="background-color: #f4e5be;">
                <div class="top-heading">

                    <h5 class="top-hajj-title">HAJJ 2024 / 1445H</h5>
                </div>
                
                <div class="govt_logo">
                    <img src="[URL LINK]/Images/Cards/govt-logo.png" alt="">
                </div>

                <div class="pak-flag-pic">
                    <img src="[URL LINK]/Images/Cards/pak-flag.png" alt="pak-flag">
                </div>

                <div class="islamic-jumeriya-pic">
                    <img src="[URL LINK]/Images/Cards/urdu-img.png" alt="">
                </div>

                <div class="islamic-republic-text">
                    <h5 style="font-weight: 600; ">islamic republic of Pakistan </h5>
                </div>

            </div>


            <div class="main-title">
                <div class="left-side-text">
                    <span style="font-size: 11px; "> {1} </span>
                    <span style="font-size: 6px;"> {2} </span>
                </div>
                <div class="right-side-text">
                    <strong style="font-size: 11px; "> {3} </strong>
                    <span style="font-size: 6px;"> {4} </span>
                </div>
                <div style="clear: both;">
                </div>
            </div>

            <div class="hajj-clinet-info-conatiner">
                <div class="student-card">
                    <div class="passport-image">
                        <img src="{25}" alt="" class="men-image">
                    </div>
                    <p class="cid-no">CID: {5} </p>
                    <div class="student-info">
                        <p style="font-weight: bolder;">
                            <span style="font-weight: normal;">Hajj ID #</span> {6}

                            <strong style="margin-left:40%; display: inline-block ; font-weight: normal; ">
                                Passport
                                No:
                            </strong>{7}
                        </p>

                        <p style="font-size: 8.5px; text-transform: uppercase;">
                            Name: <strong>
                                    {8} {9}
                                  </strong>
                        </p>

                        <p>F/H Name: <strong> {10} </strong> </p>
                        <p>Hotel Makkah : <strong> {11} </strong></p>
                        <p>
                            Azizia : <strong> {12} </strong> <strong style="margin-left:40%; display: inline-block ">
                            </strong> <i class="fa-solid fa-location-dot"></i> {13}
                        </p>
                        <p> Hotel Medina: <strong> {14} </strong> </p>

                    </div>
                </div>



            </div>

            <div class="maktab-number-container">
                <h5 class="maktab-text" style="font-size: 6px; padding: 2px 4px;">Maktab</h5>
                <h5 class="no-text" style="font-size: 14px; margin: 0; padding: 0;">{15}</h5>
                <h5 class="service-center-text" style="font-size: 5px;">Service Center <br /> Al-Bait </h5>
            </div>
        </section>
    </div>




    <div class="backcard-right-side">
        <!-- ####################### BACK-CARD-########################  -->

        <div class="back-side-design">
            <img src="[URL LINK]/Images/Cards/Back-Card.jpeg" alt="">
        </div>
        <!-- ####################### BACK-CARD-########################  -->
    </div>

    <div style="page-break-after: always;"></div>

</body>

</html>
